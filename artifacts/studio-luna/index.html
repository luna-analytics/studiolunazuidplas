          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Zwangerschapsyoga is een speciale vorm van yoga die is afgestemd op het lichaam tijdens de zwangerschap. De lessen focussen op ademhaling, ontspanning, kracht en bewustwording van je veranderende lichaam, ter voorbereiding op de bevalling."
          }
        },
        {
          "@type": "Question",
          "name": "Vanaf welke week kan ik beginnen met zwangerschapsyoga?",
          "acceptedAnswer": {
            "@type": "Answer",

          }
        },
        {
          "@type": "Question",
          "name": "Wordt zwangerschapsyoga vergoed door de verzekering?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Veel zorgverzekeraars vergoeden een zwangerschapscursus geheel of gedeeltelijk vanuit de aanvullende verzekering. Deelnemers ontvangen na aanmelding een factuur die ze zelf kunnen indienen bij hun zorgverzekeraar. Of en hoeveel er vergoed wordt verschilt per polis; aan deze informatie kunnen geen rechten worden ontleend."
          }
        },
        {
          "@type": "Question",
          "name": "Wat kost zwangerschapsyoga bij Studio Luna?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De Geboortereeks van acht wekelijkse lessen kost €195. De mama-en-babyles na afloop krijg je cadeau. Veel zorgverzekeraars vergoeden een zwangerschapscursus geheel of gedeeltelijk vanuit de aanvullende verzekering."
          }
        },
        {
          "@type": "Question",
          "name": "Wat is de Geboortereeks van Studio Luna?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "De Geboortereeks is een zwangerschapscursus van acht wekelijkse lessen zwangerschapsyoga en geboortevoorbereiding in Nieuwerkerk aan den IJssel, met na afloop mama-en-babyyoga cadeau. Er zijn twee gastlessen, van Tamar Riani over lichaamsbewustzijn, houding & balans en van bekkenfysiotherapeut Mélanie de Groot, en er zit een partnerles en een mamaspa-avond in. De groep is kleinschalig."
          }
        },
        {
          "@type": "Question",
          "name": "Waar vind ik geboortezorg in de regio Zuidplas?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Op studiolunazuidplas.nl/geboortezorg-zuidplas staat een actuele zorgkaart met verloskundigen, kraamzorg, echocentra, bekkenfysiotherapie, doula's, lactatiekundigen, cursussen en beweegaanbod voor zwangeren en moeders in Nieuwerkerk aan den IJssel, Zevenhuizen, Moordrecht en Moerkapelle."
          }
        },
        {
          "@type": "Question",
          "name": "Waar is Studio Luna gevestigd?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Studio Luna geeft les in Waldorfhaus de Perenboom, Raadhuisplein 28 in Nieuwerkerk aan den IJssel (gemeente Zuidplas). Goed bereikbaar vanuit Gouda, Capelle aan den IJssel, Waddinxveen en Rotterdam."
